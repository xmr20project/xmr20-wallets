[package]
name = "xmr20-indexer"
version = "0.0.0"
edition = "2021"
publish = false
description = "Reader of the XMR20 token ledger: follows a Monero node, applies records with the core, keeps a durable log, recovers from restarts and reorganisations."

[[bin]]
name = "xmr20-indexer-open"
path = "src/main.rs"

[dependencies]
xmr20-unshielded-core = {package = "xmr20-open-core", path = "../core"}
xmr20-unshielded-lab = {path = "../lab"}
anyhow = "1"
ark-groth16 = {version = "=0.4.0", features = ["parallel"]}
decaf377 = {version = "=0.10.1", features = ["r1cs"]}
decaf377-rdsa = "=0.11.0"
penumbra-sdk-keys = {version = "=2.1.1", default-features = false}
penumbra-sdk-shielded-pool = {version = "=2.1.1", default-features = false}
serde = {version = "1", features = ["derive"]}
serde_json = "1"
hex = "0.4"
zeroize = "=1.8.2"
monero-wallet = "=0.2.0"
monero-simple-request-rpc = "=0.1.0"
tokio = {version = "1", features = ["rt", "macros"]}

[patch.crates-io]
monero-wallet = {path = "../vendor/monero-wallet"}
penumbra-sdk-shielded-pool = {path = "../vendor/penumbra-sdk-shielded-pool"}

[workspace]
